<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CIFAR-10 Classifier</title>
  <style>
    body { font-family: system-ui, Arial; background:#f8fafc; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .card { background:#fff; width:380px; padding:24px; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.08); text-align:center; }
    h1 { font-size:22px; margin:0 0 12px; color:#0f172a; }
    p { margin:0 0 18px; color:#475569; }
    input[type=file]{ margin:12px 0; }
    button{ background:#2563eb; color:#fff; border:0; padding:10px 16px; border-radius:10px; cursor:pointer; }
    button:hover{ background:#1e40af; }
    .img-preview{ margin-top:14px; max-width:100%; border-radius:10px; display:none; }
    .result{ margin-top:14px; font-weight:600; }
    .probs{ margin-top:6px; color:#475569; font-size:14px; }
    .error{ color:#b91c1c; margin-top:10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CIFAR-10 Classifier</h1>
    <p>Upload an image to get the top-3 predictions.</p>
    <form id="uploadForm">
      <input id="fileInput" type="file" name="file" accept="image/*" required />
      <br />
      <button type="submit">Classify</button>
    </form>
    <img id="preview" class="img-preview" />
    <div id="result" class="result"></div>
    <div id="probs" class="probs"></div>
    <div id="err" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const result = document.getElementById('result');
    const probs = document.getElementById('probs');
    const err = document.getElementById('err');

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (!f) return;
      preview.src = URL.createObjectURL(f);
      preview.style.display = 'block';
      result.textContent = '';
      probs.textContent = '';
      err.textContent = '';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const f = fileInput.files[0];
      if (!f) { err.textContent = 'Please choose an image.'; return; }
      const fd = new FormData(); fd.append('file', f);

      try {
        const r = await fetch('/predict', { method: 'POST', body: fd });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Request failed');
        const [a,b,c] = data.predictions;
        result.textContent = `Top: ${a.class} (${(a.prob*100).toFixed(1)}%)`;
        probs.textContent = `Next: ${b.class} ${(b.prob*100).toFixed(1)}%, ${c.class} ${(c.prob*100).toFixed(1)}%`;
      } catch (e) {
        err.textContent = e.message;
      }
    });
  </script>
</body>
</html>
